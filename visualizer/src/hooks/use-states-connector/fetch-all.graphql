#import "./fragments/state-fragment.graphql"

query FetchStates($limit: Int!, $offset: Int!, $sort: [String!], $where: String) {
  states(limit: $limit, offset: $offset, sort: $sort, where: $where) {
    total
    count
    offset
    results {
      ...StateFragment
    }
  }
}
