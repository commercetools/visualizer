#import "./fragments/extension-fragment.graphql"

mutation UpdateExtension(
  $id: String
  $key: String
  $version: Long!
  $actions: [ExtensionUpdateAction!]!
) {
  updateExtension(id: $id, key: $key, version: $version, actions: $actions) {
    ...ExtensionFragment
  }
}
