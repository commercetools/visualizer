#import "./fragments/subscription-fragment.graphql"

mutation UpdateSubscription(
  $id: String
  $version: Long!
  $actions: [SubscriptionUpdateAction!]!
) {
  updateSubscription(version: $version, id: $id, actions: $actions) {
    ...SubscriptionFragment
  }
}
