#import "./fragments/type-definition-fragment.graphql"

mutation UpdateTypeDefinition(
  $id: String
  $key: String
  $version: Long!
  $actions: [TypeUpdateAction!]!
) {
  updateTypeDefinition(id: $id, key: $key, version: $version, actions: $actions) {
    ...TypeDefinitionFragment
  }
}
