query FetchTypeWithDefinitionByName($id: String, $includeNames: [String!]) {
  typeDefinition(id: $id) {
    id
    fieldDefinitions(includeNames: $includeNames) {
      name
      required
      inputHint
      labelAllLocales {
        locale
        value
      }
      type {
        name
        ... on ReferenceType {
          referenceTypeId
        }
        ... on SetType {
          elementType {
            name
            ... on ReferenceType {
              referenceTypeId
            }
            ... on EnumType {
              values {
                key
                label
              }
            }
            ... on LocalizedEnumType {
              values {
                key
                labelAllLocales {
                  locale
                  value
                }
              }
            }
          }
        }
        ... on EnumType {
          values {
            key
            label
          }
        }
        ... on LocalizedEnumType {
          values {
            key
            labelAllLocales {
              locale
              value
            }
          }
        }
      }
    }
    version
  }
}
